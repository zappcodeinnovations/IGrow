name: krushi_siksha
description: "IGrow — Agriculture Learning Marketplace"
publish_to: 'none'
version: 1.0.1+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Fonts & theming
  google_fonts: ^6.2.1

  # Local persistence
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Images
  cached_network_image: ^3.4.1

  # Charts (for instructor analytics in later phases)
  fl_chart: ^0.70.2

  # Utilities
  intl: ^0.20.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.1.0
  pinput: ^5.0.1
  http: ^1.6.0
  video_player: ^2.8.6
  chewie: ^1.8.5
  wakelock_plus: ^1.1.4
  chopper: any
  json_annotation: any
  image_picker: ^1.2.2
  syncfusion_flutter_pdfviewer: ^33.2.13
  screen_protector: ^1.5.3
  file_picker: ^11.0.2
  timeago: ^3.7.1
  pdf: ^3.12.0
  printing: ^5.14.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  share_plus: ^12.0.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  razorpay_flutter: ^1.4.7
  package_info_plus: ^9.0.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  chopper_generator: any
  swagger_dart_code_generator: any
  build_runner: any
  json_serializable: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
